<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recall 设置</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="options">
    <main>
      <header class="hero">
        <div class="mark">✓</div>
        <div>
          <h1>Recall</h1>
          <p>点一下，保存网页到你的飞书。</p>
        </div>
      </header>

      <section class="panel">
        <div>
          <h2>飞书连接</h2>
          <p id="connectionText">检查连接中...</p>
        </div>
        <button id="connectButton" class="primary" type="button">连接飞书</button>
      </section>

      <details class="advanced" open>
        <summary>模型设置</summary>
        <form id="aiForm">
          <label>
            API Key
            <input id="aiApiKey" name="aiApiKey" type="password" autocomplete="off" placeholder="sk-...">
            <span class="help">只保存在你的 Chrome 浏览器本地，不上传 Recall 后端。</span>
          </label>
          <label>
            模型
            <input id="aiModel" name="aiModel" type="text" placeholder="gpt-4o-mini">
          </label>
          <button type="submit">保存模型设置</button>
        </form>
      </details>

      <p id="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
